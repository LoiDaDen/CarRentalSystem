name: CI/CD - Build & Test CarRentalSystem

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '10.0.x'
  TEST_PROJECT_PATH: 'CarRentalSystem.Tests'
  MSBuildEnableWorkloadResolver: false
  DOTNET_SKIP_WORKLOAD_INTEGRITY_CHECK: true
  DOTNET_NOLOGO: true
  CAR_RENTAL_PROJECT: 'CarRentalSystem/CarRentalSystem.csproj'
  SONAR_PROJECT_KEY: 'CarRentalSystem'

jobs:

  # ═══════════════════════════════════════════════════════════
  # 🔒 SECURITY SCAN — Trivy (non-blocking)
  # ═══════════════════════════════════════════════════════════
  security-scan:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
    - name: "📥 Checkout code"
      uses: actions/checkout@v4

    - name: "🐳 Build Docker image (for scan only)"
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: carrental-scan:latest
        file: ./Dockerfile

    - name: "🔍 Trivy: Docker Image Vulnerability Scan"
      uses: aquasecurity/trivy-action@v0.28.0
      with:
        image-ref: 'carrental-scan:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        exit-code: '0'

    - name: "🔍 Check if Image SARIF exists"
      id: check_image_sarif
      run: |
        if [ -f "trivy-results.sarif" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: "🔍 Upload Trivy SARIF to GitHub Security"
      uses: github/codeql-action/upload-sarif@v3
      if: steps.check_image_sarif.outputs.exists == 'true'
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy-image-scan'

    - name: "🔍 Trivy: Scan source code for vulnerabilities"
      uses: aquasecurity/trivy-action@v0.28.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-fs-results.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'

    - name: "🔍 Check if FS SARIF exists"
      id: check_fs_sarif
      run: |
        if [ -f "trivy-fs-results.sarif" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: "🔍 Upload Trivy FS SARIF to GitHub Security"
      uses: github/codeql-action/upload-sarif@v3
      if: steps.check_fs_sarif.outputs.exists == 'true'
      with:
        sarif_file: 'trivy-fs-results.sarif'
        category: 'trivy-fs-scan'

    - name: "📋 Security Scan Summary"
      if: always()
      shell: bash
      run: |
        echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Trivy Docker image scan: **PASSED**" >> $GITHUB_STEP_SUMMARY
        echo "- Trivy source code scan: **PASSED**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════
  # 🏗️ BUILD & 🧪 TEST + SONARCLOUD
  # ═══════════════════════════════════════════════════════════
  build-test-sonar:
    name: "🏗️ Build & 🧪 Test + 🔍 SonarCloud"
    runs-on: ubuntu-latest

    steps:
    - name: "📥 Checkout code"
      uses: actions/checkout@v4

    # ═══════════════════════════════════════════════════════
    # 📦 NuGet Caching
    # ═══════════════════════════════════════════════════════
    - name: "📦 Setup NuGet Cache"
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ~/.nuget/packages_store
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/GlobalUsings.cs') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          ${{ runner.os }}-

    - name: "🔧 Setup .NET SDK"
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # ═══════════════════════════════════════════════════════
    # 🔍 SONARCLOUD — Begin Analysis (before build)
    # ═══════════════════════════════════════════════════════
    - name: "🔍 SonarCloud: Begin Analysis"
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet tool install --global dotnet-sonarscanner --version 10.0.* || true
        dotnet sonarscanner begin \
          /k:"${{ env.SONAR_PROJECT_KEY }}" \
          /n:"CarRentalSystem" \
          /v:"${{ github.run_number }}.${{ github.run_attempt }}" \
          /o:"${{ vars.SONAR_ORG }}" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.cs.opencover.reportsPaths="**/coverage.cobertura.xml" \
          /d:sonar.coverage.jacoco.xmlReportsPaths="**/coverage.cobertura.xml" \
          /d:sonar.qualitygate.wait=true \
          /d:sonar.qualitygate.timeout=300

    - name: "📦 Restore dependencies"
      run: |
        dotnet restore ${{ env.CAR_RENTAL_PROJECT }}
        dotnet restore ${{ env.TEST_PROJECT_PATH }}/${{ env.TEST_PROJECT_PATH }}.csproj

    - name: "🏗️ Build solution"
      run: |
        dotnet build ${{ env.CAR_RENTAL_PROJECT }} --configuration Release --no-restore
        dotnet build ${{ env.TEST_PROJECT_PATH }}/${{ env.TEST_PROJECT_PATH }}.csproj --configuration Release --no-restore

    # ============================================================
    # 🧪 RUN ALL TESTS IN ONE STEP (coverage collected here)
    # Running separately caused coverage files to overwrite each other.
    # Smoke tests excluded here — they need separate InMemory DB setup.
    # ============================================================
    - name: "🧪 Run Unit + Integration Tests with Coverage"
      run: |
        echo "=========================================="
        echo "🧪 BẮT ĐẦU CHẠY TESTS + COVERAGE"
        echo "=========================================="
        dotnet test --configuration Release --no-build \
          --verbosity normal \
          --filter "Type!=Smoke" \
          --logger "trx;LogFileName=test-results.trx" \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults
        echo "=========================================="
        echo "✅ TESTS HOÀN TẤT"
        echo "=========================================="
      working-directory: ${{ env.TEST_PROJECT_PATH }}

    # ── SonarCloud: End Analysis (after tests, sends coverage) ──
    - name: "🔍 SonarCloud: End Analysis"
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

    # ============================================================
    # 🌐 SMOKE TESTS — Separate step (InMemory DB via WebApplicationFactory)
    # ============================================================
    - name: "🌐 Smoke Tests (WebApplicationFactory + InMemory DB)"
      continue-on-error: true
      run: |
        echo "=========================================="
        echo "🌐 CHẠY SMOKE TESTS"
        echo "=========================================="
        dotnet test --configuration Release --no-build \
          --verbosity normal \
          --filter "Type=Smoke" \
          --logger "trx;LogFileName=smoke-test-results.trx" \
          --results-directory ./TestResults
        echo "=========================================="
        echo "✅ SMOKE TESTS HOÀN TẤT"
        echo "=========================================="
      working-directory: ${{ env.TEST_PROJECT_PATH }}

    # ============================================================
    # 📊 Code Coverage Report
    # ============================================================
    - name: "📝 Generate Code Coverage Report"
      uses: irongut/CodeCoverageSummary@v1.3.0
      if: always()
      with:
        filename: ${{ env.TEST_PROJECT_PATH }}/TestResults/**/coverage.cobertura.xml
        badge: true
        fail_below_min: false
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '50 80'

    - name: "📥 Upload Test Results & Coverage"
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          ${{ env.TEST_PROJECT_PATH }}/TestResults/*.trx
          ${{ env.TEST_PROJECT_PATH }}/TestResults/**/coverage.cobertura.xml
        retention-days: 30

    # ============================================================
    # 📋 BẢNG KẾT QUẢ CHI TIẾT
    # ============================================================
    - name: "📋 Test Results Summary"
      if: always()
      shell: bash
      run: |
        set +e

        echo "## 🧪 Kết Quả Test Chi Tiết — CarRentalSystem" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📅 Thời gian: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        parse_trx() {
          local TRX_FILE="$1"
          local SECTION_TITLE="$2"
          local SECTION_ICON="$3"

          if [ ! -f "$TRX_FILE" ]; then
            echo "### ⚠️ $SECTION_TITLE — file not found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            return
          fi

          local PASSED=$(grep -o 'outcome="Passed"' "$TRX_FILE" | wc -l)
          local FAILED=$(grep -o 'outcome="Failed"' "$TRX_FILE" | wc -l)
          local TOTAL=$((PASSED + FAILED))

          echo "### $SECTION_ICON $SECTION_TITLE: $PASSED/$TOTAL passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Test Name | Kết quả | Thời gian |" >> $GITHUB_STEP_SUMMARY
          echo "|---|-----------|---------|-----------|" >> $GITHUB_STEP_SUMMARY

          local COUNT=0
          grep -o 'testName="[^"]*"[^>]*outcome="[^"]*"[^>]*duration="[^"]*"' "$TRX_FILE" | while IFS= read -r line; do
            COUNT=$((COUNT + 1))
            local TEST_NAME=$(echo "$line" | sed 's/.*testName="\([^"]*\)".*/\1/')
            local OUTCOME=$(echo "$line" | sed 's/.*outcome="\([^"]*\)".*/\1/')
            local DURATION=$(echo "$line" | sed 's/.*duration="\([^"]*\)".*/\1/')
            local ICON="✅"
            if [ "$OUTCOME" != "Passed" ]; then
              ICON="❌"
            fi
            echo "| $COUNT | \`$TEST_NAME\` | $ICON $OUTCOME | $DURATION |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
        }

        parse_trx "${{ env.TEST_PROJECT_PATH }}/TestResults/test-results.trx" "Unit + Integration Tests" "🧪"
        parse_trx "${{ env.TEST_PROJECT_PATH }}/TestResults/smoke-test-results.trx" "Smoke Tests (Web)" "🌐"

        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        ALL_TRX="${{ env.TEST_PROJECT_PATH }}/TestResults/test-results.trx"
        if [ -f "$ALL_TRX" ]; then
          TOTAL_PASSED=$(grep -o 'outcome="Passed"' "$ALL_TRX" | wc -l)
          TOTAL_FAILED=$(grep -o 'outcome="Failed"' "$ALL_TRX" | wc -l)
          TOTAL=$((TOTAL_PASSED + TOTAL_FAILED))
          if [ "$TOTAL_FAILED" -eq 0 ]; then
            echo "### ✅ TỔNG KẾT: $TOTAL_PASSED/$TOTAL tests PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ TỔNG KẾT: $TOTAL_FAILED/$TOTAL tests FAILED" >> $GITHUB_STEP_SUMMARY
          fi
        fi

  # ============================================================
  # 🌐 CYPRESS E2E TESTS
  # ============================================================
  cypress-e2e:
    name: "🌐 Cypress E2E Tests"
    runs-on: ubuntu-latest
    needs: build-test-sonar

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "Password123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Password123! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: "📥 Checkout code"
      uses: actions/checkout@v4

    - name: "📦 NuGet Cache Restore"
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ~/.nuget/packages_store
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: "🔧 Setup .NET SDK"
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: "🔧 Setup Node.js"
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: "📦 Install Cypress"
      run: npm ci
      working-directory: .

    - name: "🚀 Start .NET App"
      run: |
        dotnet run --project CarRentalSystem/CarRentalSystem.csproj --urls "http://localhost:5168" &
        echo "⏳ Đợi app khởi động..."
        for i in $(seq 1 30); do
          if curl -sf http://localhost:5168 > /dev/null 2>&1; then
            echo "✅ App sẵn sàng sau ${i}s"
            break
          fi
          sleep 1
        done
      env:
        ASPNETCORE_ENVIRONMENT: "Development"
        ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1433;Database=CarRentalDB;User Id=sa;Password=Password123!;TrustServerCertificate=True;MultipleActiveResultSets=true"

    - name: "🌐 Run Cypress E2E Tests"
      run: npx cypress run --config baseUrl=http://localhost:5168
      working-directory: .

    - name: "📥 Upload Cypress Screenshots & Videos"
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cypress-results
        path: |
          cypress/screenshots/
          cypress/videos/
        retention-days: 14

    - name: "📋 Cypress Results Summary"
      if: always()
      shell: bash
      run: |
        echo "## 🌐 Cypress E2E Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📅 Thời gian: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -d "cypress/screenshots" ] && [ "$(ls -A cypress/screenshots 2>/dev/null)" ]; then
          echo "### ❌ Có lỗi — Screenshots đã được upload lên Artifacts" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ✅ Tất cả Cypress E2E tests PASSED!" >> $GITHUB_STEP_SUMMARY
        fi
