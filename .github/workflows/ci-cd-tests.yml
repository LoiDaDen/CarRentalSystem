name: CI/CD - Build & Test CarRentalSystem

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '10.0.x'
  TEST_PROJECT_PATH: 'CarRentalSystem.Tests'
  MSBuildEnableWorkloadResolver: false
  DOTNET_SKIP_WORKLOAD_INTEGRITY_CHECK: true
  DOTNET_NOLOGO: true
  CAR_RENTAL_PROJECT: 'CarRentalSystem/CarRentalSystem.csproj'
  APP_PORT: 8080
  REGISTRY: ${{ vars.REGISTRY_HOST }}

jobs:

  # ═══════════════════════════════════════════════════════════
  # 🔒 SECURITY SCAN — Dependency + Docker image vulnerability
  # Chạy song song với build-and-test để không tốn thêm thời gian
  # ═══════════════════════════════════════════════════════════
  security-scan:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
    - name: "📥 Checkout code"
      uses: actions/checkout@v4

    # ── 1. Trivy: Docker Image Vulnerability Scan ───────────
    - name: "🐳 Build Docker image (for scan only)"
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: carrental-scan:latest
        file: ./Dockerfile
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: "🔍 Trivy: Docker Image Vulnerability Scan"
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'carrental-scan:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        exit-code: '1'
        hide-progress: false

    - name: "🔍 Upload Trivy SARIF to GitHub Security"
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy-image-scan'

    # ── 2. OWASP Dependency-Check: NuGet packages scan ───
    - name: "🔧 Setup .NET SDK"
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: "🔧 Install OWASP Dependency-Check"
      run: |
        dotnet tool install --global dotnet-dependency-check --version 10.0.*
        export PATH="$PATH:$HOME/.dotnet/tools"

    - name: "🔍 OWASP Dependency-Check: Scan NuGet Packages"
      run: |
        dependency-check --project CarRentalSystem \
          --scan ./CarRentalSystem \
          --format SARIF \
          --output ./owasp-results \
          --failOnCVSS 7 \
          --verbose
      env:
        PATH: ${{ env.PATH }}:$HOME/.dotnet/tools

    - name: "🔍 Upload OWASP SARIF to GitHub Security"
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: './owasp-results/dependency-check-report.sarif'
        category: 'owasp-dep-check'

    - name: "📋 OWASP Scan Results Summary"
      if: always()
      shell: bash
      run: |
        echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f "./owasp-results/dependency-check-report.html" ]; then
          TOTAL=$(grep -c 'id="'+'"' ./owasp-results/dependency-check-report.html 2>/dev/null || echo "0")
          CRITICAL=$(grep -c 'severityName="CRITICAL"' ./owasp-results/dependency-check-report.sarif 2>/dev/null || echo "0")
          HIGH=$(grep -c 'severityName="HIGH"' ./owasp-results/dependency-check-report.sarif 2>/dev/null || echo "0")
          echo "### ⚠️ OWASP Dependency-Check" >> $GITHUB_STEP_SUMMARY
          echo "- 🔴 Critical: **$CRITICAL**" >> $GITHUB_STEP_SUMMARY
          echo "- 🟠 High: **$HIGH**" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ✅ OWASP: Không phát hiện lỗ hổng nghiêm trọng" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════
  # 🏗️ BUILD & 🧪 TEST
  # ═══════════════════════════════════════════════════════════
  build-and-test:
    name: "🏗️ Build & 🧪 Test"
    runs-on: ubuntu-latest

    steps:
    - name: "📥 Checkout code"
      uses: actions/checkout@v4

    # ═══════════════════════════════════════════════════════
    # 📦 NuGet Caching — Tăng tốc restore, giảm CI time
    # ═══════════════════════════════════════════════════════
    - name: "📦 Setup NuGet Cache"
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ~/.nuget/packages_store
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/GlobalUsings.cs') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          ${{ runner.os }}-

    - name: "🔧 Setup .NET SDK"
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # ═══════════════════════════════════════════════════════
    # 🧮 SONARCLOUD — Static Code Analysis
    # ═══════════════════════════════════════════════════════
    - name: "🔧 Install SonarScanner for .NET"
      run: dotnet tool install --global dotnet-sonarscanner --version 10.0.*

    - name: "🔍 SonarCloud: Begin Analysis"
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet sonarscanner begin \
          /k:"${{ vars.SONAR_ORG }}/CarRentalSystem" \
          /n:"CarRentalSystem" \
          /v:"${{ github.run_number }}" \
          /o:"${{ vars.SONAR_ORG }}" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.cs.opencover.reportsPaths="${{ env.TEST_PROJECT_PATH }}/TestResults/**/coverage.cobertura.xml" \
          /d:sonar.coverage.jacoco.xmlReportsPaths="${{ env.TEST_PROJECT_PATH }}/TestResults/**/coverage.cobertura.xml" \
          /d:sonar.qualitygate.wait=true \
          /d:sonar.qualitygate.timeout=300

    - name: "📦 Restore dependencies"
      run: |
        dotnet restore ${{ env.CAR_RENTAL_PROJECT }}
        dotnet restore ${{ env.TEST_PROJECT_PATH }}/${{ env.TEST_PROJECT_PATH }}.csproj

    - name: "🏗️ Build solution"
      run: |
        dotnet build ${{ env.CAR_RENTAL_PROJECT }} --configuration Release --no-restore
        dotnet build ${{ env.TEST_PROJECT_PATH }}/${{ env.TEST_PROJECT_PATH }}.csproj --configuration Release --no-restore

    # ============================================================
    # 🧪 UNIT TESTS — Hiển thị chi tiết từng test đang chạy
    # ============================================================
    - name: "🧪 Run Unit Tests (Chi tiết)"
      run: |
        echo "=========================================="
        echo "🧪 BẮT ĐẦU CHẠY UNIT TESTS"
        echo "=========================================="
        dotnet test --configuration Release --no-build \
          --verbosity detailed \
          --filter "Type=Unit" \
          --logger "console;verbosity=detailed" \
          --logger "trx;LogFileName=unit-test-results.trx" \
          --results-directory ./TestResults
        echo "=========================================="
        echo "✅ UNIT TESTS HOÀN TẤT"
        echo "=========================================="
      working-directory: ${{ env.TEST_PROJECT_PATH }}

    # ============================================================
    # 🔗 INTEGRATION TESTS — Hiển thị chi tiết từng test đang chạy
    # ============================================================
    - name: "🔗 Run Integration Tests (Chi tiết)"
      run: |
        echo "=========================================="
        echo "🔗 BẮT ĐẦU CHẠY INTEGRATION TESTS"
        echo "=========================================="
        dotnet test --configuration Release --no-build \
          --verbosity detailed \
          --filter "Type=Integration" \
          --logger "console;verbosity=detailed" \
          --logger "trx;LogFileName=integration-test-results.trx" \
          --results-directory ./TestResults
        echo "=========================================="
        echo "✅ INTEGRATION TESTS HOÀN TẤT"
        echo "=========================================="
      working-directory: ${{ env.TEST_PROJECT_PATH }}

    # ============================================================
    # 📊 FULL TEST SUITE + CODE COVERAGE
    # ============================================================
    - name: "📊 Run All Tests + Coverage"
      run: |
        echo "=========================================="
        echo "📊 BẮT ĐẦU CHẠY TOÀN BỘ TESTS + COVERAGE"
        echo "=========================================="
        dotnet test --configuration Release --no-build \
          --verbosity detailed \
          --filter "Type!=Smoke" \
          --logger "console;verbosity=detailed" \
          --logger "trx;LogFileName=all-test-results.trx" \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults
        echo "=========================================="
        echo "✅ FULL TEST SUITE HOÀN TẤT"
        echo "=========================================="
      working-directory: ${{ env.TEST_PROJECT_PATH }}

    # ============================================================
    # 🌐 SMOKE TESTS
    # ============================================================
    - name: "🌐 Smoke Tests — Chạy app & test trên web"
      continue-on-error: true
      run: |
        echo "=========================================="
        echo "🌐 KHỞI ĐỘNG APP & TEST TRỰC TIẾP TRÊN WEB"
        echo "=========================================="
        dotnet test --configuration Release --no-build \
          --verbosity detailed \
          --filter "Type=Smoke" \
          --logger "console;verbosity=detailed" \
          --logger "trx;LogFileName=smoke-test-results.trx" \
          --results-directory ./TestResults
        echo "=========================================="
        echo "✅ SMOKE TESTS HOÀN TẤT"
        echo "=========================================="
      working-directory: ${{ env.TEST_PROJECT_PATH }}

    # ── SonarCloud: End Analysis (phải sau khi chạy tests) ──
    - name: "🔍 SonarCloud: End Analysis"
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

    - name: "📝 Generate Code Coverage Report"
      uses: irongut/CodeCoverageSummary@v1.3.0
      if: always()
      with:
        filename: ${{ env.TEST_PROJECT_PATH }}/TestResults/**/coverage.cobertura.xml
        badge: true
        fail_below_min: false
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '50 80'

    - name: "📋 Add Coverage PR Comment"
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md

    - name: "📥 Upload Test Results & Coverage"
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          ${{ env.TEST_PROJECT_PATH }}/TestResults/*.trx
          ${{ env.TEST_PROJECT_PATH }}/TestResults/**/coverage.cobertura.xml
        retention-days: 30

    # ============================================================
    # 📋 BẢNG KẾT QUẢ CHI TIẾT — Parse .trx hiển thị từng test
    # ============================================================
    - name: "📋 Bảng kết quả chi tiết từng Test Case"
      if: always()
      shell: bash
      run: |
        set +e

        echo "## 🧪 Kết Quả Test Chi Tiết — CarRentalSystem" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📅 Thời gian: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        parse_trx() {
          local TRX_FILE="$1"
          local SECTION_TITLE="$2"
          local SECTION_ICON="$3"

          if [ ! -f "$TRX_FILE" ]; then
            echo "### ⚠️ $SECTION_TITLE — file not found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            return
          fi

          local PASSED=$(grep -o 'outcome="Passed"' "$TRX_FILE" | wc -l)
          local FAILED=$(grep -o 'outcome="Failed"' "$TRX_FILE" | wc -l)
          local TOTAL=$((PASSED + FAILED))

          echo "### $SECTION_ICON $SECTION_TITLE: $PASSED/$TOTAL passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Test Name | Kết quả | Thời gian |" >> $GITHUB_STEP_SUMMARY
          echo "|---|-----------|---------|-----------|" >> $GITHUB_STEP_SUMMARY

          local COUNT=0
          grep -o 'testName="[^"]*"[^>]*outcome="[^"]*"[^>]*duration="[^"]*"' "$TRX_FILE" | while IFS= read -r line; do
            COUNT=$((COUNT + 1))
            local TEST_NAME=$(echo "$line" | sed 's/.*testName="\([^"]*\)".*/\1/')
            local OUTCOME=$(echo "$line" | sed 's/.*outcome="\([^"]*\)".*/\1/')
            local DURATION=$(echo "$line" | sed 's/.*duration="\([^"]*\)".*/\1/')
            local ICON="✅"
            if [ "$OUTCOME" != "Passed" ]; then
              ICON="❌"
            fi
            echo "| $COUNT | \`$TEST_NAME\` | $ICON $OUTCOME | $DURATION |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
        }

        parse_trx "${{ env.TEST_PROJECT_PATH }}/TestResults/unit-test-results.trx" "Unit Tests" "🧪"
        parse_trx "${{ env.TEST_PROJECT_PATH }}/TestResults/integration-test-results.trx" "Integration Tests" "🔗"
        parse_trx "${{ env.TEST_PROJECT_PATH }}/TestResults/smoke-test-results.trx" "Smoke Tests" "🌐"

        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        ALL_TRX="${{ env.TEST_PROJECT_PATH }}/TestResults/all-test-results.trx"
        if [ -f "$ALL_TRX" ]; then
          TOTAL_PASSED=$(grep -o 'outcome="Passed"' "$ALL_TRX" | wc -l)
          TOTAL_FAILED=$(grep -o 'outcome="Failed"' "$ALL_TRX" | wc -l)
          TOTAL=$((TOTAL_PASSED + TOTAL_FAILED))
          if [ "$TOTAL_FAILED" -eq 0 ]; then
            echo "### ✅ TỔNG KẾT: $TOTAL_PASSED/$TOTAL tests PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ TỔNG KẾT: $TOTAL_FAILED/$TOTAL tests FAILED" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "### ⚠️ Full test results file not found" >> $GITHUB_STEP_SUMMARY
        fi

    # ============================================================
    # 🐳 BUILD & PUBLISH DOCKER IMAGE
    # Chỉ chạy khi push lên main hoặc develop
    # ============================================================
    - name: "🐳 Login to Container Registry"
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.REGISTRY_HOST }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: "🐳 Set up Docker Buildx"
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      uses: docker/setup-buildx-action@v3

    - name: "🐳 Build and Push Docker Image"
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ vars.REGISTRY_HOST }}/carrental/${{ github.ref_name }}:${{ github.sha }}
          ${{ vars.REGISTRY_HOST }}/carrental/${{ github.ref_name }}:latest
          ${{ vars.REGISTRY_HOST }}/carrental/${{ github.ref_name }}:${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'v' || '' }}${{ github.run_number }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        file: ./Dockerfile

    - name: "📋 Save Docker Image Tags"
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      run: |
        echo "${{ vars.REGISTRY_HOST }}/carrental/${{ github.ref_name }}:${{ github.sha }}" > .docker-image-tags.txt
        echo "${{ vars.REGISTRY_HOST }}/carrental/${{ github.ref_name }}:latest" >> .docker-image-tags.txt
        echo "${{ vars.REGISTRY_HOST }}/carrental/${{ github.ref_name }}:${{ github.run_number }}" >> .docker-image-tags.txt
        cat .docker-image-tags.txt

    - name: "📥 Upload Docker Image Tags as Artifact"
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-tags
        path: .docker-image-tags.txt
        retention-days: 30

  # ============================================================
  # 🌐 CYPRESS E2E TESTS
  # ============================================================
  cypress-e2e:
    name: "🌐 Cypress E2E Tests"
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "Password123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Password123! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: "📥 Checkout code"
      uses: actions/checkout@v4

    - name: "📦 NuGet Cache Restore"
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ~/.nuget/packages_store
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: "🔧 Setup .NET SDK"
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: "🔧 Setup Node.js"
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: "📦 Install Cypress"
      run: npm ci
      working-directory: .

    - name: "🚀 Start .NET App (Background)"
      run: |
        dotnet run --project CarRentalSystem/CarRentalSystem.csproj --urls "http://localhost:5168" &
        echo "⏳ Đợi app khởi động..."
        sleep 15
        echo "✅ App đã khởi động!"
      env:
        ASPNETCORE_ENVIRONMENT: "Development"
        ConnectionStrings__DefaultConnection: "Server=127.0.0.1,1433;Database=CarRentalDB;User Id=sa;Password=Password123!;TrustServerCertificate=True;MultipleActiveResultSets=true"

    - name: "🌐 Run Cypress E2E Tests"
      run: npx cypress run --config baseUrl=http://localhost:5168
      working-directory: .

    - name: "📥 Upload Cypress Screenshots & Videos"
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cypress-results
        path: |
          cypress/screenshots/
          cypress/videos/
        retention-days: 14

    - name: "📋 Cypress Results Summary"
      if: always()
      shell: bash
      run: |
        echo "## 🌐 Cypress E2E Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📅 Thời gian: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -d "cypress/screenshots" ] && [ "$(ls -A cypress/screenshots 2>/dev/null)" ]; then
          echo "### ❌ Có lỗi — Screenshots đã được upload lên Artifacts" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ✅ Tất cả Cypress E2E tests PASSED!" >> $GITHUB_STEP_SUMMARY
        fi

  # ============================================================
  # 🚀 DEPLOY TO STAGING
  # ============================================================
  deploy-staging:
    name: "🚀 Deploy to Staging"
    runs-on: ubuntu-latest
    needs: [build-and-test, cypress-e2e, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    # ── Tạo Environment "staging" trên GitHub trước khi uncomment ──
    # Settings → Environments → New environment → Name: "staging"
    # environment:
    #   name: staging
    #   url: ${{ vars.STAGING_APP_URL }}

    steps:
    - name: "📥 Checkout code"
      uses: actions/checkout@v4

    - name: "📦 NuGet Cache Restore"
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ~/.nuget/packages_store
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: "🔧 Setup .NET SDK"
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: "🗄️ Run Database Migration on Staging"
      run: |
        echo "=========================================="
        echo "🗄️ BẮT ĐẦU APPLY DATABASE MIGRATION"
        echo "=========================================="
        dotnet ef database update \
          --project CarRentalSystem/CarRentalSystem.csproj \
          --connection "${{ secrets.STAGING_CONNECTION_STRING }}" \
          --no-build \
          --configuration Release
        echo "✅ Database Migration HOÀN TẤT"
        echo "=========================================="
      continue-on-error: true
      env:
        DOTNET_EF_MIGRATIONS: CarRentalSystem/Migrations

    - name: "📦 Restore Staging"
      run: dotnet restore ${{ env.CAR_RENTAL_PROJECT }}

    - name: "🚀 Publish Self-Contained App"
      run: |
        dotnet publish ${{ env.CAR_RENTAL_PROJECT }} \
          --configuration Release \
          --output ./publish/staging \
          --self-contained true \
          --runtime linux-x64 \
          -p:PublishSingleFile=false \
          -p:IncludeNativeLibrariesForSelfExtract=true

    - name: "🔵 Setup Azure CLI"
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_STAGING_CREDENTIALS }}

    - name: "🚀 Deploy to Azure App Service (Staging Slot)"
      run: |
        echo "=========================================="
        echo "🚀 BẮT ĐẦU DEPLOY LÊN STAGING"
        echo "=========================================="
        az webapp up \
          --name "${{ vars.STAGING_APP_NAME }}" \
          --resource-group "${{ vars.STAGING_RESOURCE_GROUP }}" \
          --slot "staging" \
          --location "Southeast Asia" \
          --os-type "Linux" \
          --runtime "DOTNET|10" \
          --zip-deploy-file ./publish/staging.zip \
          --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
        echo "✅ DEPLOY HOÀN TẤT — Staging Slot"
        echo "🌐 URL: https://${{ vars.STAGING_APP_NAME }}-staging.${{ vars.AZURE_DEPLOYMENT_DOMAIN }}"
        echo "⏳ Warmup Staging..."
        sleep 5
        curl -f -s -o /dev/null -w "%{http_code}" \
          "https://${{ vars.STAGING_APP_NAME }}-staging.${{ vars.AZURE_DEPLOYMENT_DOMAIN }}/health" \
          || echo "⚠️ Health check chưa trả về 200"
        echo "=========================================="
      continue-on-error: true

    - name: "🔄 Swap Staging → Production Slot"
      run: |
        echo "=========================================="
        echo "🔄 SWAP STAGING → PRODUCTION SLOT"
        echo "=========================================="
        az webapp deployment slot swap \
          --resource-group "${{ vars.STAGING_RESOURCE_GROUP }}" \
          --name "${{ vars.STAGING_APP_NAME }}" \
          --slot staging \
          --target-slot production
        echo "✅ SWAP HOÀN TẤT"
        echo "=========================================="
      continue-on-error: true

    - name: "🔵 Logout from Azure"
      if: always()
      run: az logout

  # ============================================================
  # 🚀 DEPLOY TO PRODUCTION
  # ============================================================
  deploy-production:
    name: "🚀 Deploy to Production"
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # ── Tạo Environment "production" trên GitHub trước khi uncomment ──
    # Settings → Environments → New environment → Name: "production"
    # ── Production environment NÊN có required reviewers để approve trước khi deploy ──
    # environment:
    #   name: production
    #   url: ${{ vars.PRODUCTION_APP_URL }}

    steps:
    - name: "📥 Checkout code"
      uses: actions/checkout@v4

    - name: "📦 NuGet Cache Restore"
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ~/.nuget/packages_store
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: "🔧 Setup .NET SDK"
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: "🗄️ Run Database Migration on Production"
      run: |
        echo "=========================================="
        echo "🗄️ BẮT ĐẦU APPLY DATABASE MIGRATION TRÊN PRODUCTION"
        echo "⚠️  CẨN THẬN — ĐÂY LÀ PRODUCTION!"
        echo "=========================================="
        dotnet ef database update \
          --project CarRentalSystem/CarRentalSystem.csproj \
          --connection "${{ secrets.PRODUCTION_CONNECTION_STRING }}" \
          --no-build \
          --configuration Release
        echo "✅ Production Database Migration HOÀN TẤT"
        echo "=========================================="
      env:
        DOTNET_EF_MIGRATIONS: CarRentalSystem/Migrations

    - name: "📦 Restore Production"
      run: dotnet restore ${{ env.CAR_RENTAL_PROJECT }}

    - name: "🚀 Publish Self-Contained App"
      run: |
        dotnet publish ${{ env.CAR_RENTAL_PROJECT }} \
          --configuration Release \
          --output ./publish/production \
          --self-contained true \
          --runtime linux-x64 \
          -p:PublishSingleFile=false \
          -p:IncludeNativeLibrariesForSelfExtract=true

    - name: "🔵 Setup Azure CLI"
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_PROD_CREDENTIALS }}

    - name: "🚀 Deploy to Azure App Service (Production)"
      run: |
        echo "=========================================="
        echo "🚀 BẮT ĐẦU DEPLOY LÊN PRODUCTION"
        echo "⚠️  CẨN THẬN — ĐÂY LÀ PRODUCTION!"
        echo "=========================================="
        az webapp up \
          --name "${{ vars.PRODUCTION_APP_NAME }}" \
          --resource-group "${{ vars.PRODUCTION_RESOURCE_GROUP }}" \
          --location "Southeast Asia" \
          --os-type "Linux" \
          --runtime "DOTNET|10" \
          --zip-deploy-file ./publish/production.zip \
          --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
        echo "✅ PRODUCTION DEPLOY HOÀN TẤT"
        echo "⏳ Kiểm tra health endpoint..."
        sleep 5
        HTTP_CODE=$(curl -f -s -o /dev/null -w "%{http_code}" \
          "${{ vars.PRODUCTION_APP_URL }}/health")
        echo "Health check HTTP: $HTTP_CODE"
        if [ "$HTTP_CODE" == "200" ]; then
          echo "✅ Health check PASSED — Production đã sẵn sàng!"
        else
          echo "❌ Health check FAILED — Cần kiểm tra logs!"
          exit 1
        fi
        echo "=========================================="

    - name: "🔵 Logout from Azure"
      if: always()
      run: az logout
