name: CI/CD - Build & Test CarRentalSystem

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '10.0.x'
  TEST_PROJECT_PATH: 'CarRentalSystem.Tests'
  MSBuildEnableWorkloadResolver: false
  DOTNET_SKIP_WORKLOAD_INTEGRITY_CHECK: true
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: "🏗️ Build & 🧪 Test"
    runs-on: ubuntu-latest

    steps:
    - name: "📥 Checkout code"
      uses: actions/checkout@v4

    - name: "🔧 Setup .NET SDK"
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: "📦 Restore dependencies"
      run: |
        dotnet restore CarRentalSystem/CarRentalSystem.csproj
        dotnet restore CarRentalSystem.Tests/CarRentalSystem.Tests.csproj

    - name: "🏗️ Build solution"
      run: |
        dotnet build CarRentalSystem/CarRentalSystem.csproj --configuration Release --no-restore
        dotnet build CarRentalSystem.Tests/CarRentalSystem.Tests.csproj --configuration Release --no-restore

    # ============================================================
    # 🧪 UNIT TESTS — Hiển thị chi tiết từng test đang chạy
    # ============================================================
    - name: "🧪 Run Unit Tests (Chi tiết)"
      run: |
        echo "=========================================="
        echo "🧪 BẮT ĐẦU CHẠY UNIT TESTS"
        echo "=========================================="
        dotnet test --configuration Release --no-build \
          --verbosity detailed \
          --filter "Type=Unit" \
          --logger "console;verbosity=detailed" \
          --logger "trx;LogFileName=unit-test-results.trx" \
          --results-directory ./TestResults
        echo "=========================================="
        echo "✅ UNIT TESTS HOÀN TẤT"
        echo "=========================================="
      working-directory: ${{ env.TEST_PROJECT_PATH }}

    # ============================================================
    # 🔗 INTEGRATION TESTS — Hiển thị chi tiết từng test đang chạy
    # ============================================================
    - name: "🔗 Run Integration Tests (Chi tiết)"
      run: |
        echo "=========================================="
        echo "🔗 BẮT ĐẦU CHẠY INTEGRATION TESTS"
        echo "=========================================="
        dotnet test --configuration Release --no-build \
          --verbosity detailed \
          --filter "Type=Integration" \
          --logger "console;verbosity=detailed" \
          --logger "trx;LogFileName=integration-test-results.trx" \
          --results-directory ./TestResults
        echo "=========================================="
        echo "✅ INTEGRATION TESTS HOÀN TẤT"
        echo "=========================================="
      working-directory: ${{ env.TEST_PROJECT_PATH }}

    # ============================================================
    # 📊 FULL TEST SUITE + CODE COVERAGE
    # ============================================================
    - name: "📊 Run All Tests + Coverage (Chi tiết)"
      run: |
        echo "=========================================="
        echo "📊 BẮT ĐẦU CHẠY TOÀN BỘ TESTS + COVERAGE"
        echo "=========================================="
        dotnet test --configuration Release --no-build \
          --verbosity detailed \
          --logger "console;verbosity=detailed" \
          --logger "trx;LogFileName=all-test-results.trx" \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults
        echo "=========================================="
        echo "✅ FULL TEST SUITE HOÀN TẤT"
        echo "=========================================="
      working-directory: ${{ env.TEST_PROJECT_PATH }}

    # ============================================================
    # 🌐 SMOKE TESTS — Khởi động app rồi test trực tiếp trên web
    # ============================================================
    - name: "🌐 Smoke Tests — Chạy app & test trên web (Chi tiết)"
      run: |
        echo "=========================================="
        echo "🌐 KHỞI ĐỘNG APP & TEST TRỰC TIẾP TRÊN WEB"
        echo "=========================================="
        dotnet test --configuration Release --no-build \
          --verbosity detailed \
          --filter "Type=Smoke" \
          --logger "console;verbosity=detailed" \
          --logger "trx;LogFileName=smoke-test-results.trx" \
          --results-directory ./TestResults
        echo "=========================================="
        echo "✅ SMOKE TESTS HOÀN TẤT"
        echo "=========================================="
      working-directory: ${{ env.TEST_PROJECT_PATH }}

    - name: "📝 Generate Code Coverage Report"
      uses: irongut/CodeCoverageSummary@v1.3.0
      if: always()
      with:
        filename: ${{ env.TEST_PROJECT_PATH }}/TestResults/**/coverage.cobertura.xml
        badge: true
        fail_below_min: false
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '50 80'

    - name: "📋 Add Coverage PR Comment"
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md

    - name: "📥 Upload Test Results & Coverage"
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          ${{ env.TEST_PROJECT_PATH }}/TestResults/*.trx
          ${{ env.TEST_PROJECT_PATH }}/TestResults/**/coverage.cobertura.xml
        retention-days: 30

    # ============================================================
    # 📋 BẢNG KẾT QUẢ CHI TIẾT — Parse .trx hiển thị từng test
    # ============================================================
    - name: "📋 Bảng kết quả chi tiết từng Test Case"
      if: always()
      shell: bash
      run: |
        set +e

        echo "## 🧪 Kết Quả Test Chi Tiết — CarRentalSystem" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📅 Thời gian: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        parse_trx() {
          local TRX_FILE="$1"
          local SECTION_TITLE="$2"
          local SECTION_ICON="$3"

          if [ ! -f "$TRX_FILE" ]; then
            echo "### ⚠️ $SECTION_TITLE — file not found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            return
          fi

          local PASSED=$(grep -o 'outcome="Passed"' "$TRX_FILE" | wc -l)
          local FAILED=$(grep -o 'outcome="Failed"' "$TRX_FILE" | wc -l)
          local TOTAL=$((PASSED + FAILED))

          echo "### $SECTION_ICON $SECTION_TITLE: $PASSED/$TOTAL passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Test Name | Kết quả | Thời gian |" >> $GITHUB_STEP_SUMMARY
          echo "|---|-----------|---------|-----------|" >> $GITHUB_STEP_SUMMARY

          local COUNT=0
          grep -o 'testName="[^"]*"[^>]*outcome="[^"]*"[^>]*duration="[^"]*"' "$TRX_FILE" | while IFS= read -r line; do
            COUNT=$((COUNT + 1))
            local TEST_NAME=$(echo "$line" | sed 's/.*testName="\([^"]*\)".*/\1/')
            local OUTCOME=$(echo "$line" | sed 's/.*outcome="\([^"]*\)".*/\1/')
            local DURATION=$(echo "$line" | sed 's/.*duration="\([^"]*\)".*/\1/')
            local ICON="✅"
            if [ "$OUTCOME" != "Passed" ]; then
              ICON="❌"
            fi
            echo "| $COUNT | \`$TEST_NAME\` | $ICON $OUTCOME | $DURATION |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
        }

        parse_trx "${{ env.TEST_PROJECT_PATH }}/TestResults/unit-test-results.trx" "Unit Tests" "🧪"
        parse_trx "${{ env.TEST_PROJECT_PATH }}/TestResults/integration-test-results.trx" "Integration Tests" "🔗"
        parse_trx "${{ env.TEST_PROJECT_PATH }}/TestResults/smoke-test-results.trx" "Smoke Tests — Chạy app & test trên web" "🌐"

        # --- Overall Summary ---
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        ALL_TRX="${{ env.TEST_PROJECT_PATH }}/TestResults/all-test-results.trx"
        if [ -f "$ALL_TRX" ]; then
          TOTAL_PASSED=$(grep -o 'outcome="Passed"' "$ALL_TRX" | wc -l)
          TOTAL_FAILED=$(grep -o 'outcome="Failed"' "$ALL_TRX" | wc -l)
          TOTAL=$((TOTAL_PASSED + TOTAL_FAILED))
          if [ "$TOTAL_FAILED" -eq 0 ]; then
            echo "### ✅ TỔNG KẾT: $TOTAL_PASSED/$TOTAL tests PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ TỔNG KẾT: $TOTAL_FAILED/$TOTAL tests FAILED" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "### ⚠️ Full test results file not found" >> $GITHUB_STEP_SUMMARY
        fi

  # ============================================================
  # 🌐 CYPRESS E2E TESTS — Chạy ứng dụng thật + test trình duyệt
  # ============================================================
  cypress-e2e:
    name: "🌐 Cypress E2E Tests"
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: "📥 Checkout code"
      uses: actions/checkout@v4

    - name: "🔧 Setup .NET SDK"
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: "🔧 Setup Node.js"
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: "📦 Install Cypress"
      run: |
        cd UITests
        npm ci
      working-directory: .

    - name: "🚀 Start .NET App (Background)"
      run: |
        dotnet run --project CarRentalSystem/CarRentalSystem.csproj --urls "http://localhost:5168" &
        echo "⏳ Đợi app khởi động..."
        sleep 15
        echo "✅ App đã khởi động!"
      env:
        ASPNETCORE_ENVIRONMENT: "Testing"

    - name: "🌐 Run Cypress E2E Tests"
      run: npx cypress run --config baseUrl=http://localhost:5168
      working-directory: .

    - name: "📥 Upload Cypress Screenshots & Videos"
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cypress-results
        path: |
          cypress/screenshots/
          cypress/videos/
        retention-days: 14

    - name: "📋 Cypress Results Summary"
      if: always()
      shell: bash
      run: |
        echo "## 🌐 Cypress E2E Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📅 Thời gian: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -d "cypress/screenshots" ] && [ "$(ls -A cypress/screenshots 2>/dev/null)" ]; then
          echo "### ❌ Có lỗi — Screenshots đã được upload lên Artifacts" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ✅ Tất cả Cypress E2E tests PASSED!" >> $GITHUB_STEP_SUMMARY
        fi
