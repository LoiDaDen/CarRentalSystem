name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test:
    runs-on: windows-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=(localdb)\MSSQLLocalDB;Database=CarRentalCi;Trusted_Connection=True;TrustServerCertificate=True;MultipleActiveResultSets=true
      Security__EnableRecurringJobs: false
      Security__RunMigrationsOnStartup: false
      Security__SeedReferenceDataOnStartup: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore CarRentalSystem/CarRentalSystem.csproj
          dotnet restore CarRentalSystem.Tests/CarRentalSystem.Tests.csproj
      - name: Build
        run: dotnet build CarRentalSystem/CarRentalSystem.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test CarRentalSystem.Tests/CarRentalSystem.Tests.csproj --no-restore --configuration Release
      - name: Local tracked secret scan
        shell: pwsh
        run: ./CarRentalSystem/scripts/Test-TrackedSecrets.ps1 -RepoRoot ./CarRentalSystem
      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.3
      - name: Check idempotent migration script
        run: dotnet ef migrations script --idempotent --project CarRentalSystem/CarRentalSystem.csproj --startup-project CarRentalSystem/CarRentalSystem.csproj --no-build --configuration Release --output migration-check.sql

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
