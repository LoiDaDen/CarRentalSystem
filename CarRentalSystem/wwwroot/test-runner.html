<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>🧪 CarRental — Full Auto Test Runner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a16;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #0f1629 0%, #1a1a3e 50%, #0f1629 100%);
            padding: 20px 32px;
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .badge.waiting {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .badge.running {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            animation: pulse 1s infinite;
        }

        .badge.done {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .badge.fail {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0.5
            }
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background: #1e1e3a;
            border-radius: 3px;
            overflow: hidden;
            margin: 0 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            border-radius: 3px;
            transition: width 0.3s;
            width: 0%;
        }

        .btn {
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            color: #fff;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .stats-bar {
            display: flex;
            gap: 12px;
            padding: 16px 32px;
            background: rgba(15, 22, 41, 0.8);
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #111827;
            border-radius: 8px;
            border: 1px solid #1e293b;
        }

        .stat .num {
            font-size: 22px;
            font-weight: 800;
        }

        .stat .lbl {
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat.total .num {
            color: #818cf8;
        }

        .stat.pass .num {
            color: #4ade80;
        }

        .stat.fail .num {
            color: #f87171;
        }

        .stat.skip .num {
            color: #fbbf24;
        }

        .stat.time .num {
            color: #38bdf8;
            font-size: 16px;
        }

        .main {
            display: flex;
            height: calc(100vh - 130px);
        }

        .test-panel {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px;
        }

        .preview-panel {
            width: 42%;
            border-left: 1px solid rgba(99, 102, 241, 0.15);
            display: flex;
            flex-direction: column;
            background: #0d1117;
        }

        .preview-header {
            padding: 10px 16px;
            background: #161b22;
            border-bottom: 1px solid #21262d;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot.r {
            background: #f87171;
        }

        .dot.y {
            background: #fbbf24;
        }

        .dot.g {
            background: #4ade80;
        }

        .url-bar {
            flex: 1;
            background: #0d1117;
            padding: 4px 12px;
            border-radius: 4px;
            color: #38bdf8;
            font-size: 11px;
            font-family: monospace;
            border: 1px solid #21262d;
        }

        .preview-panel iframe {
            flex: 1;
            border: none;
            background: #fff;
        }

        .group {
            margin-bottom: 20px;
        }

        .group-header {
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        .group-header .count {
            font-size: 10px;
            background: #1e293b;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .group-stats {
            margin-left: auto;
            font-size: 10px;
        }

        .t-item {
            background: #111827;
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #1e293b;
            transition: all 0.2s;
            font-size: 13px;
        }

        .t-item.running {
            border-color: #f59e0b;
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.06), #111827);
        }

        .t-item.passed {
            border-color: rgba(34, 197, 94, 0.3);
            background: linear-gradient(90deg, rgba(34, 197, 94, 0.04), #111827);
        }

        .t-item.failed {
            border-color: rgba(239, 68, 68, 0.3);
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.04), #111827);
        }

        .t-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .t-item.waiting .t-icon {
            background: #1e293b;
        }

        .t-item.running .t-icon {
            background: rgba(245, 158, 11, 0.2);
            animation: pulse 0.6s infinite;
        }

        .t-item.passed .t-icon {
            background: rgba(34, 197, 94, 0.2);
        }

        .t-item.failed .t-icon {
            background: rgba(239, 68, 68, 0.2);
        }

        .t-name {
            flex: 1;
        }

        .t-name .method {
            font-size: 9px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 3px;
            margin-right: 4px;
        }

        .t-name .method.get {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }

        .t-name .method.post {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
        }

        .t-name .method.api {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
        }

        .t-name .desc {
            color: #64748b;
            font-size: 10px;
            display: block;
            margin-top: 1px;
        }

        .t-time {
            font-size: 11px;
            color: #64748b;
            min-width: 50px;
            text-align: right;
            font-family: monospace;
        }

        .t-status {
            font-size: 11px;
            font-weight: 600;
            min-width: 45px;
            text-align: right;
        }

        .t-item.passed .t-status {
            color: #4ade80;
        }

        .t-item.failed .t-status {
            color: #f87171;
        }
    </style>
</head>

        let passed = 0, failed = 0, skipped = 0, done = 0, startTime = 0;

        function render() {
            const groups = {};
            tests.forEach((t, i) => { if (!groups[t.g]) groups[t.g] = []; groups[t.g].push({ ...t, i }); });
            let html = '';
            for (const [g, items] of Object.entries(groups)) {
                html += `<div class="group"><div class="group-header">${g} <span class="count">${items.length}</span><span class="group-stats" id="gs-${g.replace(/[^a-zA-Z]/g, '')}"></span></div>`;
                items.forEach(t => {
                    const mc = t.m === 'POST' ? 'post' : t.m === 'API' ? 'api' : 'get';
                    html += `<div class="t-item waiting" id="t${t.i}">
                <div class="t-icon">⏳</div>
                <span class="t-name"><span class="method ${mc}">${t.m}</span>${t.n}<span class="desc">${t.u} → ${t.d}</span></span>
                <span class="t-time" id="tm${t.i}">—</span>
                <span class="t-status" id="st${t.i}">Chờ</span>
            </div>`;
                });
                html += '</div>';
            }
            document.getElementById('testPanel').innerHTML = html;
            document.getElementById('sTotal').textContent = tests.length;
        }

        function updateStats() {
            document.getElementById('sPass').textContent = passed;
            document.getElementById('sFail').textContent = failed;
            document.getElementById('sSkip').textContent = skipped;
            document.getElementById('sTime').textContent = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
            document.getElementById('progressFill').style.width = (done / tests.length * 100) + '%';
            document.getElementById('progressText').textContent = done + '/' + tests.length;
        }

        let lastLoadedUrl = '';
        let liveTimer = null;
        let currentAbortCtrl = null;

        async function runTest(i) {
            const t = tests[i];
            const el = document.getElementById('t' + i);
            const tm = document.getElementById('tm' + i);
            const st = document.getElementById('st' + i);
            el.className = 't-item running';
            el.querySelector('.t-icon').textContent = '🔄';
            st.textContent = '...';
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });

            document.getElementById('urlBar').textContent = B + t.u;

            const s = Date.now();
            try {
                const ctrl = new AbortController();
                currentAbortCtrl = ctrl;
                const timer = setTimeout(() => ctrl.abort(), 4000);

                const opts = {
                    signal: ctrl.signal,
                    cache: 'no-store'
                };

                if (t.body) {
                    opts.method = 'POST';
                    if (t.json) {
                        opts.headers = { 'Content-Type': 'application/json' };
                        opts.body = t.body;
                    } else {
                        opts.headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
                        opts.body = t.body;
                    }
                }

                const fetchUrl = B + t.u + (t.u.includes('?') ? '&' : '?') + '_nc=' + Date.now() + i;

                const r = await fetch(fetchUrl, opts);
                clearTimeout(timer);
                const h = await r.text();
                const d = Date.now() - s;
                tm.textContent = d + 'ms';
                if (t.c(h, r.status)) {
                    el.className = 't-item passed'; el.querySelector('.t-icon').textContent = '✅';
                    st.textContent = 'HTTP ' + r.status; passed++;
                } else {
                    el.className = 't-item failed'; el.querySelector('.t-icon').textContent = '❌';
                    st.textContent = 'HTTP ' + r.status; failed++;
                }

                if (!t.body && t.m !== 'POST') {
                    if (lastLoadedUrl !== t.u) {
                        document.getElementById('preview').src = fetchUrl;
                        lastLoadedUrl = t.u;
                    }
                }
            } catch (e) {
                tm.textContent = (Date.now() - s) + 'ms';
                el.className = 't-item failed'; el.querySelector('.t-icon').textContent = '❌';
                st.textContent = e.name === 'AbortError' ? 'TIMEOUT' : 'ERROR'; failed++;
            }
            done++;
            updateStats();
        }

        async function runGroup(groupName) {
            // Chỉ lấy các tests thuộc group này
            const groupTests = tests.filter(t => t.g === groupName);

            document.getElementById('badge').className = 'badge running';
            document.getElementById('badge').textContent = '🔄 TESTING MODULE...';

            // Ghi đè startTime cho mượt
            if (done === 0) startTime = Date.now();

            for (const t of groupTests) {
                await runTest(t.i);
                await new Promise(r => setTimeout(r, 150));
            }

            document.getElementById('badge').className = 'badge waiting';
            document.getElementById('badge').textContent = '✅ MODULE XONG';
        }

        async function runAllTests() {
            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnStart').textContent = '⏳ Đang chạy...';
            document.getElementById('badge').className = 'badge running';
            document.getElementById('badge').textContent = '🔄 TESTING ALL...';
            passed = 0; failed = 0; skipped = 0; done = 0; startTime = Date.now();
            updateStats();

            // Reset UI
            tests.forEach((t, i) => {
                const el = document.getElementById('t' + i);
                el.className = 't-item waiting';
                el.querySelector('.t-icon').textContent = '⏳';
                document.getElementById('tm' + i).textContent = '—';
                document.getElementById('st' + i).textContent = 'Chờ';
            });

            for (let i = 0; i < tests.length; i++) {
                await runTest(i);
                await new Promise(r => setTimeout(r, 150));
            }

            const el = ((Date.now() - startTime) / 1000).toFixed(1);
            const b = document.getElementById('badge');
            b.className = failed === 0 ? 'badge done' : 'badge fail';
            b.textContent = failed === 0 ? `✅ ALL ${passed} PASSED (${el}s)` : `❌ ${failed} FAILED`;
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnStart').textContent = '🔄 Chạy lại toàn bộ';
        }

        function render() {
            const groups = {};
            tests.forEach((t, i) => {
                t.i = i; // Save index
                if (!groups[t.g]) groups[t.g] = [];
                groups[t.g].push(t);
            });
            let html = '';
            for (const [g, items] of Object.entries(groups)) {
                // Thêm nút chạy riêng cho từng group
                html += `<div class="group"><div class="group-header" style="justify-content: space-between;">
            <div style="display:flex;align-items:center;gap:8px;">${g} <span class="count">${items.length}</span></div>
            <button onclick="runGroup('${g}')" style="background:#1e293b;border:1px solid #334155;color:#38bdf8;padding:4px 10px;border-radius:4px;font-size:10px;cursor:pointer;">▶ Chạy Module Này</button>
        </div>`;
                items.forEach(t => {
                    const mc = t.m === 'POST' ? 'post' : t.m === 'API' ? 'api' : 'get';
                    html += `<div class="t-item waiting" id="t${t.i}">
                <div class="t-icon">⏳</div>
                <span class="t-name"><span class="method ${mc}">${t.m}</span>${t.n}<span class="desc">${t.u} → ${t.d}</span></span>
                <span class="t-time" id="tm${t.i}">—</span>
                <span class="t-status" id="st${t.i}">Chờ</span>
            </div>`;
                });
                html += '</div>';
            }
            document.getElementById('testPanel').innerHTML = html;
            document.getElementById('sTotal').textContent = tests.length;
        }

        render();
        // Bỏ tự động chạy để bạn tự bấm module cần test
        // setTimeout(() => runAllTests(), 500);
