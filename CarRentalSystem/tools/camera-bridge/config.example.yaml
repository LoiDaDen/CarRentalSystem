nvr:
  host: "192.168.1.200"
  rtsp_port: 554
  username: "admin"
  password_env: "NVR_PASSWORD"
  rtsp_template: "rtsp://{username}:{password}@{host}:{port}/cam/realmonitor?channel={channel}&subtype=0"

processing:
  sample_fps: 1.5
  min_emit_confidence: 0.80
  dedupe_seconds: 45
  ocr_gpu: false
  save_snapshots: true
  snapshot_public_base_url: ""

webhook:
  enabled: false
  url_env: "WEBHOOK_URL"
  timeout_seconds: 10
  send_low_confidence: false

output:
  directory: "output"
  event_log: "output/events.jsonl"

preview:
  enabled: true
  host: "127.0.0.1"
  port: 8765
  jpeg_quality: 80
  stream_fps: 6

cameras:
  - code: "CAM-IN-05"
    name: "Gate In Channel 5"
    channel: 5
    direction: "In"
    enabled: true
    webhook_secret_env: "WEBHOOK_SECRET_CAM_IN_05"
  - code: "CAM-IN-13"
    name: "Gate In Channel 13"
    channel: 13
    direction: "In"
    enabled: true
    webhook_secret_env: "WEBHOOK_SECRET_CAM_IN_13"
  - code: "CAM-OUT-02"
    name: "Gate Out Channel 2"
    channel: 2
    direction: "Out"
    enabled: true
    webhook_secret_env: "WEBHOOK_SECRET_CAM_OUT_02"
  - code: "CAM-OUT-03"
    name: "Gate Out Channel 3"
    channel: 3
    direction: "Out"
    enabled: true
    webhook_secret_env: "WEBHOOK_SECRET_CAM_OUT_03"
  - code: "CAM-OUT-15"
    name: "Gate Out Channel 15"
    channel: 15
    direction: "Out"
    enabled: true
    webhook_secret_env: "WEBHOOK_SECRET_CAM_OUT_15"
