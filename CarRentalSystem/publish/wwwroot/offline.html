<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CarRental - Offline</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Inter, Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            padding: 24px;
        }

        main {
            max-width: 420px;
            text-align: center;
        }

        img {
            width: 84px;
            height: 84px;
            object-fit: contain;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.5rem;
        }

        p {
            margin: 0;
            color: #64748b;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <main>
        <img src="/images/car_rental_logo.png" alt="CarRental">
        <h1>Bạn đang ngoại tuyến</h1>
        <p>Vui lòng kiểm tra kết nối mạng rồi tải lại trang để tiếp tục sử dụng CarRental.</p>
    </main>
</body>
</html>
