# ============================================================
# SonarCloud — Project Configuration
# Analysis cho CarRentalSystem
#
# Để chạy local analysis:
#   dotnet sonarscanner begin /k:"CarRentalSystem" /d:sonar.host.url="https://sonarcloud.io"
#   dotnet build
#   dotnet test ...
#   dotnet sonarscanner end
# ============================================================

sonar.projectKey=CarRentalSystem
sonar.projectName=CarRentalSystem
sonar.projectVersion=1.0.0

# ── Source paths ─────────────────────────────────────────────
sonar.sources=CarRentalSystem
sonar.tests=CarRentalSystem.Tests

# ── Language ───────────────────────────────────────────────
sonar.language=cs
sonar.dotnet.version=10.0

# ── Coverage ───────────────────────────────────────────────
sonar.cs.opencover.reportsPaths=CarRentalSystem.Tests/TestResults/**/coverage.cobertura.xml

# ── Exclusions (generated files, migrations) ───────────────
sonar.exclusions=\
  **/*.Designer.cs,\
  **/*.generated.cs,\
  **/Migrations/**,\
  **/wwwroot/**,\
  **/node_modules/**,\
  **/*.min.js,\
  **/obj/**,\
  **/bin/**

sonar.test.exclusions=**/Migrations/**,**/obj/**,**/bin/**

# ── Quality Gate ────────────────────────────────────────────
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# ── Encoding ────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
