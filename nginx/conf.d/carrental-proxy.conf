# ─────────────────────────────────────────────────────────
# CarRentalSystem — Production Reverse Proxy Config
# Nginx as reverse proxy đứng trước ASP.NET Core app
# ─────────────────────────────────────────────────────────

upstream carrental_backend {
    server web:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Redirect HTTP → HTTPS in production
    # return 301 https://$host$request_uri;

    # ── Security Headers ───────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"      always;
    add_header X-Content-Type-Options "nosniff"         always;
    add_header X-XSS-Protection       "1; mode=block"   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip Compression ──────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               application/rss+xml image/svg+xml;

    # ── Static Files ──────────────────────────────────────
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Uploads ──────────────────────────────────────────
    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Health Check ──────────────────────────────────────
    location /health {
        proxy_pass         http://carrental_backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        access_log         off;
    }

    # ── Hangfire Dashboard ────────────────────────────────
    location /hangfire/ {
        proxy_pass         http://carrental_backend/hangfire/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Rate limit Hangfire
        limit_req zone=api burst=20 nodelay;
    }

    # ── API / MVC ────────────────────────────────────────
    location / {
        proxy_pass         http://carrental_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffering
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
        proxy_busy_buffers_size 8k;

        # WebSocket support (nếu cần)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Rate Limiting ─────────────────────────────────────
    limit_req zone=general burst=50 nodelay;
    limit_conn addr 10;
}

